name: Weekly Earnings Surprise Archive

on:
  schedule:
    - cron: '0 22 * * 5'   # once a week, Friday after close
  workflow_dispatch:

permissions:
  contents: write   # needed to commit the accumulated archive back

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - run: python weekly_earnings_surprise_archive.py

      - name: Commit updated archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add earnings_surprise_archive/earnings_surprises.parquet
          git diff --staged --quiet && echo "No new earnings surprises this run" || git commit -m "Weekly earnings surprise update: $(date +%Y-%m-%d)"
          git push
