name: Weekly Fundamentals Archive

# Company financials update quarterly -> weekly cron catches new
# filings within days, no need for a daily schedule (unlike
# options/short-interest). Runs Monday morning UTC; workflow_dispatch
# lets you trigger it manually from the GitHub Actions tab too.
'on':
  schedule:
    - cron: '0 6 * * 1'   # κάθε Δευτέρα 06:00 UTC
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Γενναιόδωρο όριο -- ~500 tickers x (SEC fetch + rate-limit sleep)
    # μπορεί εύκολα να φτάσει 20-40 λεπτά.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fundamentals ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python weekly_fundamentals_archive.py
